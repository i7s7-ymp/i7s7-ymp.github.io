cloudArchitectures:
  - id: vpc-microservices
    title: VPCマイクロサービス基盤
    summary: ECS(Fargate) + ALB + RDS + VPC サブネット分離構成。
    image: /diagrams/vpc-microservices.svg
    services: [ECS, Fargate, ALB, RDS, CloudWatch, VPC]
    year: 2024
    provider: AWS
  - id: serverless-event-driven
    title: サーバーレスイベント駆動
    summary: API Gateway + Lambda + DynamoDB + EventBridge による疎結合イベント処理。
    image: /diagrams/serverless-event-driven.svg
    services: [APIGateway, Lambda, DynamoDB, EventBridge, CloudWatch]
    year: 2025
    provider: GCP
  - id: data-analytics-pipeline
    title: データ分析パイプライン
    summary: Kinesis 収集 → S3 レイク → Glue ETL → Athena/QuickSight 分析のバッチ+準リアルタイム基盤。
    image: /diagrams/data-analytics-pipeline.svg
    services: [Kinesis, S3, Glue, Athena, QuickSight]
    year: 2023
    provider: AWS
