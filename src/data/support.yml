    description: CMDB 的ドメインモデル
  - title: 認証統合 PoC
    category: [Security Identity & Compliance]
    architecture: Component-Based
    description: 認証コンポーネント統合
  - title: 静的コンテンツ配信
    category: [Network & Content Delivery]
