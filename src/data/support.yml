header:
  title: アーキテクチャ経験
  subtitle: クラウド & アプリケーション設計
  icon: 🧱
  iconBgClass: bg-gradient-to-r from-accent-cyan to-accent-blue
  tags: [cloud, scalability, design]
cloudCases:
  - id: aws-microservices
    title: AWS マイクロサービス構成
    stack: AWS • Kubernetes • Docker
    diagram: |-
      Clients
        ↓
      CloudFront + Route53
        ↓
      ALB
        ↓
      EKS Cluster
        ├─ API Gateway Service
        ├─ User Service (RDS)
        ├─ Order Service (DynamoDB)
        └─ Payment Service (ElastiCache)
      Observability: CloudWatch, X-Ray
    desc: AWSを活用したマイクロサービスアーキテクチャ。EKSとAPI Gatewayによるスケーラブルな構成。
    tags: [AWS, Kubernetes, Microservices]
    colors: [blue, green, orange]
  - id: gcp-data-pipeline
    title: GCP データパイプライン
    stack: GCP • BigQuery • Dataflow
    diagram: |-
      Ingestion: Cloud Storage (Data Lake)
        ↓
      Dataflow Pipelines
        ├─ ETL Processing
        ├─ Real-time Analytics
        └─ ML Pipeline (Vertex AI)
        ↓
      BigQuery (Warehouse)
        ↓
      Visualization: Looker / Data Studio
    desc: GCPベースのデータパイプライン。リアルタイム分析とML統合のアーキテクチャ。
    tags: [GCP, BigQuery, ML Pipeline]
    colors: [yellow, purple, cyan]
  - id: azure-devops
    title: Azure DevOps 統合
    stack: Azure • AKS • DevOps
    diagram: |-
      Azure DevOps Pipelines (CI/CD)
        ↓
      Container Registry (Artifacts)
        ↓
      AKS Cluster
        ├─ App Gateway
        ├─ Workload Pods / Container Instances
        └─ Azure SQL Database
      Monitoring: Azure Monitor / Logs
    desc: Azure環境でのCI/CD統合アーキテクチャ。AKSとDevOpsパイプラインの組み合わせ。
    tags: [Azure, AKS, CI/CD]
    colors: [cyan, green, orange]
  - id: serverless
    title: サーバーレス構成
    stack: AWS Lambda • API Gateway • DynamoDB
    diagram: |-
      Clients
        ↓
      CloudFront
        ↓
      API Gateway
        ↓
      Lambda Functions
        ├─ Auth (Cognito)
        ├─ Business Logic
        └─ Data Processing
      Data Stores: DynamoDB, S3
    desc: 完全サーバーレス構成のWebアプリケーション。コスト効率とスケーラビリティを両立。
    tags: [Serverless, Lambda, DynamoDB]
    colors: [purple, yellow, blue]
appPatterns:
  - name: Clean Architecture
    color: green
    diagram: |-
      ┌─────────────── Presentation ───────────────┐
      │ Controllers / ViewModels                   │
      └────────────────────────────────────────────┘
                       ↓ depends on
      ┌──────────────── Application ───────────────┐
      │ Use Cases (Interactors)                    │
      └────────────────────────────────────────────┘
                       ↓ depends on
      ┌────────────────── Domain ──────────────────┐
      │ Entities / Value Objects / Domain Services │
      └────────────────────────────────────────────┘
                       ↓ depends on (inverted)
      ┌───────────── Infrastructure ───────────────┐
      │ Repositories / Gateways / External APIs    │
      └────────────────────────────────────────────┘
    desc: 依存関係逆転による保守性の高いアーキテクチャ
  - name: CQRS Pattern
    color: blue
    diagram: |-
      +-----------+     +----------------+     +-----------+
      | Commands  | --> | CommandHandler | --> | Write DB  |
      +-----------+     +----------------+     +-----------+
             | emits Events                           ▲
             v                                        │ project
        +---------+          update           +---------------+
        | Event   | ------------------------> | Read Model(s) |
        |  Bus    | <------------------------ | (Read DB)     |
        +---------+         rehydrate         +---------------+
             ▲                                        │ query
             |                                        v
      +-----------+     +---------------+      +-------------+
      | Queries   | --> | QueryHandler  | ---> | Responses   |
      +-----------+     +---------------+      +-------------+
    desc: 読み取りと書き込みの分離によるパフォーマンス最適化
  - name: Event Sourcing
    color: purple
    diagram: |-
      User Action
        ↓
      Command Handler
        ↓ emits Event
      Event Store (Append Only)
        ↓ replay / time-travel
      Projection Handlers
        ↓ build
      Materialized Views (Read Models)
        ↓
      API / UI Queries
    desc: イベント駆動による監査可能なシステム設計
