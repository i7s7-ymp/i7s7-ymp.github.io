<?xml version="1.0" encoding="UTF-8"?>
<svg width="800" height="450" viewBox="0 0 800 450" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="title desc">
  <title id="title">No Cloud Architecture Diagram</title>
  <desc id="desc">表示できるクラウドアーキテクチャ図がまだありません。後日追加されます。</desc>
  <defs>
